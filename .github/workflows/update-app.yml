name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app # secrets are gated by this environment
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Tabby
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');

            const upstream = { owner: 'Eugeny', repo: 'tabby' };
            const archivePattern = /^tabby-(\d+\.\d+\.\d+)-setup-x64\.exe$/;

            function compareVersions(left, right) {
              const leftParts = left.split('.').map(Number);
              const rightParts = right.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                const diff = leftParts[i] - rightParts[i];
                if (diff !== 0) {
                  return diff;
                }
              }
              return 0;
            }

            function propertyValue(content, name) {
              const match = content.match(new RegExp(`^${name.replaceAll('.', '\\.')}\\s*=\\s*(.+)$`, 'm'));
              if (!match) {
                throw new Error(`Missing ${name} in build.properties`);
              }
              return match[1].trim();
            }

            function replaceProperty(content, name, value) {
              const pattern = new RegExp(`^(${name.replaceAll('.', '\\.')}\\s*=\\s*).+$`, 'm');
              return content.replace(pattern, (_, prefix) => `${prefix}${value}`);
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...upstream,
              per_page: 100
            });
            const candidates = releases.flatMap(release => {
              if (release.draft || release.prerelease || !/^v\d+\.\d+\.\d+$/.test(release.tag_name)) {
                return [];
              }
              const version = release.tag_name.slice(1);
              const asset = release.assets.find(asset => {
                const match = archivePattern.exec(asset.name);
                return match && match[1] === version;
              });
              return asset ? [{ version, url: asset.browser_download_url }] : [];
            });
            if (candidates.length === 0) {
              throw new Error('No stable Tabby x64 installer found');
            }
            candidates.sort((left, right) => compareVersions(left.version, right.version));
            const latest = candidates.at(-1);
            core.info(`Latest stable Tabby installer: ${latest.version} (${latest.url})`);

            const file = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const content = fs.readFileSync(file, 'utf8');
            const currentVersion = propertyValue(content, 'app.version');
            const currentRelease = Number(propertyValue(content, 'app.release'));
            if (!/^\d+\.\d+\.\d+$/.test(currentVersion) || !Number.isInteger(currentRelease)) {
              throw new Error('Invalid app.version or app.release in build.properties');
            }

            if (compareVersions(latest.version, currentVersion) > 0) {
              const updated = replaceProperty(
                replaceProperty(content, 'app.version', latest.version),
                'app.release', String(currentRelease + 1)
              );
              fs.writeFileSync(file, updated, 'utf8');
              core.info(`Updated build.properties to Tabby ${latest.version}`);
            } else {
              core.info(`build.properties is already at Tabby ${currentVersion} or newer`);
            }

            core.setOutput('version', latest.version);
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-tabby
          token: ${{ steps.write-app.outputs.token }}
          commit-message: Tabby ${{ steps.update.outputs.version }}
          title: Tabby ${{ steps.update.outputs.version }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates Tabby to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Tabby
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
